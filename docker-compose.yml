version: "3.8"

services:

  nginx:
    build: ./nginx
    container_name: nginx_cont
    ports:
      - "80:80"
    depends_on:
      - django
    restart: always
    networks:
      - notes-net


  django:
    build: .
    container_name: django_cont
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      gunicorn notesapp.wsgi:application --bind 0.0.0.0:8000
      "
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    networks:
      - notes-net


  db:
    image: mysql:8.0
    container_name: db_cont
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - notes-net


volumes:
  mysql_data:


networks:
  notes-net:
